# 日本語歌詞データに特化したBERTopicパイプライン設定

# 基本設定
random_seed: 42
log_level: INFO
cache_dir: cache
output_dir: output

# Embedding設定
embedding:
  model_name: "intfloat/multilingual-e5-base"
  normalize_embeddings: true
  use_e5_prefix: true
  batch_size: 32
  device: null # nullなら自動判定（GPUがあれば使用）
  cache_dir: null

# UMAP設定
umap:
  n_neighbors: 20
  n_components: 5
  min_dist: 0.1
  metric: "cosine"
  random_state: 42

# HDBSCAN設定
hdbscan:
  min_cluster_size: 120 # データ規模に応じて調整（50万フレーズ想定）
  min_samples: 5
  cluster_selection_method: "eom"
  prediction_data: true

# Vectorizer設定
vectorizer:
  ngram_range: [1, 2]
  min_df: 2 # 絶対値（2ドキュメント以上）または相対値（0.01など）を指定可能
  max_df: 0.7 # 相対値（70%以上のドキュメントに出現する単語を除外）
  stop_words:
    - "yeah"
    - "oh"
    - "ah"
    - "woo"
    - "na"
    - "lalala"
    - "ららら"
    - "ラララ"

# c-TF-IDF設定
ctfidf:
  reduce_frequent_words: true

# データ前処理設定
data_processing:
  min_phrase_length: 12 # これより短いフレーズは結合を試みる
  max_duplicate_count: 2 # 曲内で同一lyricがこれより多い場合は間引く
  combine_window: 3 # 短いフレーズ結合時の前後ウィンドウ
  remove_empty: true
  remove_single_char: true

# トピックモデル設定
topic_model:
  calculate_probabilities: true
  top_k_free_topics: 3 # 保存する上位k個の自由トピック確率
  target_free_topics: 20 # reduce_topics後の目標トピック数
  reduce_topics: true

# マッピング設定
mapping:
  use_softmax: true
  temperature: 1.0 # softmaxの温度パラメータ

