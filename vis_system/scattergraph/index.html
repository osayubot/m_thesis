<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Emotion Pie Scatter (stable)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        margin: 16px;
      }
      .json-selector select {
        height: 60px;
        font-size: 20px;
        margin: 4px 0;
      }
      .controls {
        margin-bottom: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .zoom-controls {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 16px;
      }
      .zoom-controls button {
        padding: 8px 16px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: white;
        cursor: pointer;
        transition: background-color 0.2s;
      }
      .zoom-controls button:hover {
        background: #f0f0f0;
      }
      .zoom-controls button:active {
        background: #e0e0e0;
      }
      .zoom-hint {
        font-size: 12px;
        color: #666;
        margin-left: 8px;
      }
      .cluster-info {
        font-size: 12px;
        color: #666;
        margin-top: 8px;
      }
      .controls label {
        font-weight: 600;
        font-size: 14px;
      }
      .controls select {
        padding: 6px 12px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: white;
        cursor: pointer;
        min-width: 150px;
      }
      .controls select:hover {
        border-color: #999;
      }
      .filter-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .filter-group label {
        font-size: 12px;
        font-weight: 500;
      }
      .filter-group input[type="number"] {
        width: 80px;
        padding: 4px 8px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 4px;
        margin: 0 4px;
      }
      .filter-group input[type="number"]:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .filter-group .date-range {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 4px;
      }
      .filter-group select:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .wrap {
        position: relative;
        width: min(2000px, 100%);
      }
      canvas {
        width: 100%;
        height: 1200px;
        background: #fff;
      }

      .pie-tooltip {
        position: absolute;
        pointer-events: auto; /* tooltip内でのイベントを有効化（スクロールのため） */
        z-index: 1000;
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        border-radius: 12px;
        padding: 10px 12px;
        font: 13px/1.35 system-ui, -apple-system, Segoe UI, sans-serif;
        min-width: 240px;
        max-width: 420px;
        max-height: 520px;
        overflow: auto;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
        transform: translate(10px, 10px);
        opacity: 0;
        transition: opacity 0.06s linear;
      }
      .pie-tooltip .title {
        font-size: 14px;
        font-weight: 800;
        margin-bottom: 8px;
        opacity: 0.95;
        white-space: nowrap;
      }
      .pie-tooltip .rows {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .pie-tooltip .row {
        display: grid;
        grid-template-columns: 16px 1fr auto;
        align-items: center;
        column-gap: 8px;
      }
      .pie-tooltip .swatch {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        border: 2px solid rgba(255, 255, 255, 0.95);
        display: inline-block;
      }
      .pie-tooltip .name {
        font-weight: 650;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pie-tooltip .val {
        font-variant-numeric: tabular-nums;
        font-weight: 800;
        opacity: 0.95;
        white-space: nowrap;
      }

      .pie-tooltip .hint {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.16);
        font-size: 12px;
        opacity: 0.85;
      }
      .pie-tooltip .songs {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.16);
        font-size: 12px;
        opacity: 0.95;
      }
      .pie-tooltip .songs .head {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 900;
        margin-bottom: 6px;
        font-size: 12px;
        opacity: 0.95;
      }
      .pie-tooltip .songs ul {
        margin: 0;
        padding-left: 18px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-height: 400px;
        overflow-y: auto;
        overflow-x: hidden;
      }
      .pie-tooltip .songs ul::-webkit-scrollbar {
        width: 8px;
      }
      .pie-tooltip .songs ul::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
      }
      .pie-tooltip .songs ul::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.3);
        border-radius: 4px;
      }
      .pie-tooltip .songs ul::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.5);
      }
      .activeRow {
        outline: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 8px;
        padding: 4px 6px;
        margin-left: -6px;
        margin-right: -6px;
        background: rgba(255, 255, 255, 0.06);
      }
    </style>
  </head>

  <body>
    <div class="controls">
      <div class="json-selector">
        <label for="jsonSelector" id="jsonSelectorLabel">データセット</label>
        <br />
        <select id="jsonSelector">
          <optgroup label="UMAP">
            <option value="umap_all.json">UMAP - 統合（3つの基準進行）</option>
          </optgroup>
          <optgroup label="t-SNE">
            <option value="tsne_all.json">t-SNE - 統合（3つの基準進行）</option>
          </optgroup>
        </select>
      </div>
    </div>
    <div class="controls">
      <div class="filter-group">
        <label for="artistFilter"><strong>アーティスト</strong></label>
        <select id="artistFilter" multiple size="3">
          <option value="" selected>すべて</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="composerFilter"><strong>作曲家</strong></label>
        <select id="composerFilter" multiple size="3">
          <option value="" selected>すべて</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="lyricistFilter"><strong>作詞家</strong></label>
        <select id="lyricistFilter" multiple size="3">
          <option value="" selected>すべて</option>
        </select>
      </div>
      <div class="filter-group">
        <label for="releaseDateMinInput"><strong>リリース年</strong></label>
        <div class="date-range">
          <input
            type="number"
            id="releaseDateMinInput"
            min="1900"
            max="2100"
            placeholder="開始年"
          />
          <span>~</span>
          <input
            type="number"
            id="releaseDateMaxInput"
            min="1900"
            max="2100"
            placeholder="終了年"
          />
        </div>
      </div>

      <div class="filter-group">
        <label for="popularityMinInput"><strong>Spotify人気度</strong></label>
        <div class="date-range">
          <input
            type="number"
            id="popularityMinInput"
            min="0"
            max="100"
            placeholder="最小値"
          />
          <span>~</span>
          <input
            type="number"
            id="popularityMaxInput"
            min="0"
            max="100"
            placeholder="最大値"
          />
        </div>
      </div>
    </div>
    <div class="wrap" id="wrap">
      <canvas id="myChart"></canvas>
    </div>

    <script>
      /* ====== プルチックの感情の輪 - 8つの基本感情の色定義 ====== */
      const EMOTION_COLORS = {
        JOY: "#FFFF73", // 黄色（喜び）
        SADNESS: "#5150F8", // 青（悲しみ）
        ANTICIPATION: "#F3AB63", // オレンジ（期待）
        SURPRISE: "#74BBF9", // 水色（驚き）
        ANGER: "#E93323", // 赤（怒り）
        FEAR: "#429429", // 緑（恐れ）
        DISGUST: "#EB60F8", // 紫（嫌悪）
        TRUST: "#88FC6E", // 黄緑（信頼）
      };

      // 後方互換性のため
      const SENTIMENT_COLORS = {
        positive: "#FF0000", // 真っ赤（ポジティブ）
        negative: "#0000FF", // 真っ青（ネガティブ）
        neutral: "#9E9E9E", // グレー（中立）
      };

      /* ====== 基準進行別の色定義 ====== */
      // 【新しい基準進行を追加する場合】
      // 1. program/visualize_scattergraph_data/common.py の REFERENCE_PROGRESSIONS と REFERENCE_COLORS を更新
      // 2. 以下の3つのオブジェクトにも同じキーで追加してください：
      //    - PROGRESSION_COLORS: 星の色（rgba形式、透明度0.8推奨）
      //    - PROGRESSION_BORDER_COLORS: 背景色（透明度0で非表示）
      //    - PROGRESSION_NAMES: 表示名（日本語）
      const PROGRESSION_COLORS = {
        odo: "rgba(255, 152, 0, 1.0)", // オレンジ（王道進行）- 星マーク用に不透明度1.0
        komuro: "rgba(76, 175, 80, 1.0)", // 緑（小室進行）- 星マーク用に不透明度1.0
        marusa: "rgba(156, 39, 176, 1.0)", // 紫（丸サ進行）- 星マーク用に不透明度1.0
      };

      const PROGRESSION_BORDER_COLORS = {
        odo: "rgba(0, 0, 0, 0)",
        komuro: "rgba(0, 0, 0, 0)",
        marusa: "rgba(0, 0, 0, 0)",
      };

      // 基準進行名の日本語マッピング（ツールチップで表示される名前）
      const PROGRESSION_NAMES = {
        odo: "王道進行",
        komuro: "小室進行",
        marusa: "丸サ進行",
      };

      /* ====== 感情の順序定義（プルチックの感情の輪） ====== */
      const EMOTION_ORDER = [
        "JOY", // 喜び
        "SADNESS", // 悲しみ
        "ANTICIPATION", // 期待
        "SURPRISE", // 驚き
        "ANGER", // 怒り
        "FEAR", // 恐れ
        "DISGUST", // 嫌悪
        "TRUST", // 信頼
      ];

      // 後方互換性のため
      const SENTIMENT_ORDER = [
        "positive", // ポジティブ
        "negative", // ネガティブ
        "neutral", // 中立
      ];

      /* ====== 感情の順序に基づいてpieデータをソート ====== */
      function sortPieByEmotionOrder(pie) {
        if (!pie || !Array.isArray(pie)) return pie;
        const orderMap = new Map(
          EMOTION_ORDER.map((emotion, index) => [emotion, index])
        );
        return [...pie].sort((a, b) => {
          const orderA = orderMap.get(a.label) ?? 999;
          const orderB = orderMap.get(b.label) ?? 999;
          return orderA - orderB;
        });
      }

      /* ====== 状態 ====== */
      let chart = null;
      let selected = null; // { datasetIndex, index, emotion }
      let EMOTION_SONGS = {}; // JSONから読み込む
      let allPoints = []; // 全ポイントデータ（フィルタリング前）
      let releaseDateRange = { min: 1900, max: 2025 }; // release_dateの範囲
      let popularityRange = { min: 0, max: 100 }; // spotify_popularityの範囲
      let clickHandler = null; // クリックハンドラを保存
      let clusteredPoints = []; // クラスタリング後のポイント
      let jsonFileName = ""; // 現在読み込まれているJSONファイル名

      /* ====== tooltip要素（1回だけ作る） ====== */
      function ensureTooltipEl() {
        const wrap = document.getElementById("wrap");
        let el = wrap.querySelector(".pie-tooltip");
        if (!el) {
          el = document.createElement("div");
          el.className = "pie-tooltip";
          wrap.appendChild(el);
        }
        return el;
      }

      /* ========= ミニ円グラフを drawImage で貼る（キャッシュ + hover拡大） ========= */
      const piePointsCachedHover = {
        id: "piePointsCachedHover",
        _cache: new Map(),

        _makeKey(pie, r, strokeStyle, lineWidth) {
          // 感情の順序に基づいてソートしてからキーを生成（一貫性のため）
          const sortedPie = sortPieByEmotionOrder(pie);
          return JSON.stringify({ pie: sortedPie, r, strokeStyle, lineWidth });
        },

        _renderPieToCanvas(pie, r, strokeStyle, lineWidth, dpr) {
          // 感情の順序に基づいてソート
          const sortedPie = sortPieByEmotionOrder(pie);

          // 半径が0以下の場合は最小サイズのcanvasを返す
          const minR = 1;
          const safeR = Math.max(minR, r);

          const pad = lineWidth;
          const size = Math.max(1, Math.ceil((safeR * 2 + pad * 2) * dpr));
          const c = document.createElement("canvas");
          c.width = size;
          c.height = size;
          const ctx = c.getContext("2d");

          const cx = size / 2;
          const cy = size / 2;
          const rr = safeR * dpr;

          const total = sortedPie.reduce((a, s) => a + s.v, 0);
          if (total <= 0 || size <= 0) {
            // 空のcanvasを返す（最小サイズを保証）
            return { canvas: c, w: Math.max(1, size), h: Math.max(1, size) };
          }

          let start = -Math.PI / 2;
          for (const s of sortedPie) {
            const ang = (s.v / total) * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, rr, start, start + ang);
            ctx.closePath();
            // 色が設定されていない場合は、EMOTION_COLORSから取得
            const color =
              s.c ||
              EMOTION_COLORS[s.label] ||
              SENTIMENT_COLORS[s.label] ||
              "#808080";
            ctx.fillStyle = color;
            ctx.fill();
            start += ang;
          }

          if (lineWidth > 0) {
            ctx.strokeStyle = strokeStyle;
            ctx.lineWidth = lineWidth * dpr;
            ctx.beginPath();
            ctx.arc(cx, cy, rr, 0, Math.PI * 2);
            ctx.stroke();
          }

          return { canvas: c, w: size, h: size };
        },

        afterDatasetsDraw(chart, args, opts) {
          const { ctx } = chart;
          const dpr =
            chart.currentDevicePixelRatio || window.devicePixelRatio || 1;
          const defaultStrokeStyle = opts?.strokeStyle ?? "#fff";
          const lineWidth = opts?.lineWidth ?? 0;
          const minR = opts?.minRadius ?? 6;
          const hoverBoost = opts?.hoverBoost ?? 3;

          const active = chart.getActiveElements?.() ?? [];

          chart.data.datasets.forEach((ds, di) => {
            const meta = chart.getDatasetMeta(di);

            meta.data.forEach((pt, i) => {
              const d = ds.data[i];
              const { x, y } = pt.getProps(["x", "y"], true);

              // 基準進行の場合は円グラフではなく星マークのみを表示（最初にチェック）
              if (d.isReferenceProgression) {
                const isActive = active.some(
                  (a) => a.datasetIndex === di && a.index === i
                );
                const baseR = d.r ?? 12;
                const r = Math.max(minR, baseR) + (isActive ? hoverBoost : 0);
                const starSize = r * 2.5; // 星のサイズを大きく（半径の2.5倍）
                // 基準進行の色を黒に統一
                const starColor = "rgb(0, 0, 0)"; // 全ての基準進行を黒で表示
                // 星マークのみを描画（円グラフは描画しない）
                drawStar(ctx, x, y, starSize, starColor);
                return; // 基準進行の場合はここで終了
              }

              // 通常の点の処理
              const pie = d.pie;
              if (!pie?.length) return;

              const isActive = active.some(
                (a) => a.datasetIndex === di && a.index === i
              );

              const baseR = d.r ?? 6;
              const r = Math.max(minR, baseR) + (isActive ? hoverBoost : 0);

              // borderを表示しないため、strokeStyleは使用しない
              const strokeStyle = "#fff"; // 使用されないが、キー生成のために必要

              // 感情の順序に基づいてソート
              const sortedPie = sortPieByEmotionOrder(pie);

              const key = this._makeKey(sortedPie, r, strokeStyle, lineWidth);
              let img = this._cache.get(key);
              if (!img) {
                img = this._renderPieToCanvas(
                  sortedPie,
                  r,
                  strokeStyle,
                  lineWidth,
                  dpr
                );
                this._cache.set(key, img);
              }

              const drawW = img.w / dpr;
              const drawH = img.h / dpr;

              // canvasのサイズが0の場合は描画をスキップ
              if (
                drawW <= 0 ||
                drawH <= 0 ||
                img.canvas.width <= 0 ||
                img.canvas.height <= 0
              ) {
                return;
              }

              // 通常の点は円グラフを描画
              ctx.drawImage(
                img.canvas,
                x - drawW / 2,
                y - drawH / 2,
                drawW,
                drawH
              );
            });
          });
        },
      };
      Chart.register(piePointsCachedHover);

      /* ====== 星を描画する関数 ====== */
      function drawStar(ctx, x, y, size, color) {
        const spikes = 5;
        const outerRadius = size;
        const innerRadius = size * 0.4;
        let rot = (Math.PI / 2) * 3;
        let xPos = x;
        let yPos = y;
        const step = Math.PI / spikes;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(x, y - outerRadius);
        for (let i = 0; i < spikes; i++) {
          xPos = x + Math.cos(rot) * outerRadius;
          yPos = y + Math.sin(rot) * outerRadius;
          ctx.lineTo(xPos, yPos);
          rot += step;

          xPos = x + Math.cos(rot) * innerRadius;
          yPos = y + Math.sin(rot) * innerRadius;
          ctx.lineTo(xPos, yPos);
          rot += step;
        }
        ctx.lineTo(x, y - outerRadius);
        ctx.closePath();
        ctx.fillStyle = color;
        ctx.fill();
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
      }

      /* ====== クラスタリング関数 ====== */
      function clusterPointsByProgression(points, gridSize = 20) {
        // 基準進行別にグループ化
        const groups = {
          odo: [],
          komuro: [],
          marusa: [],
        };

        points.forEach((point) => {
          if (point.progressionType) {
            groups[point.progressionType].push(point);
          }
        });

        const clusters = [];

        // 各基準進行グループ内でクラスタリング
        Object.keys(groups).forEach((progressionType) => {
          const groupPoints = groups[progressionType];
          if (groupPoints.length === 0) return;

          // 座標の範囲を計算
          const xs = groupPoints.map((p) => p.x);
          const ys = groupPoints.map((p) => p.y);
          const minX = Math.min(...xs);
          const maxX = Math.max(...xs);
          const minY = Math.min(...ys);
          const maxY = Math.max(...ys);

          const cellWidth = (maxX - minX) / gridSize;
          const cellHeight = (maxY - minY) / gridSize;

          // グリッドセルにポイントを分類
          const grid = {};
          groupPoints.forEach((point) => {
            const cellX = Math.floor((point.x - minX) / cellWidth);
            const cellY = Math.floor((point.y - minY) / cellHeight);
            const cellKey = `${cellX}_${cellY}`;

            if (!grid[cellKey]) {
              grid[cellKey] = [];
            }
            grid[cellKey].push(point);
          });

          // 各セルをクラスタとして処理
          Object.keys(grid).forEach((cellKey) => {
            const cellPoints = grid[cellKey];
            if (cellPoints.length === 0) return;

            // クラスタの中心座標
            const centerX =
              cellPoints.reduce((sum, p) => sum + p.x, 0) / cellPoints.length;
            const centerY =
              cellPoints.reduce((sum, p) => sum + p.y, 0) / cellPoints.length;

            // 平均感情分布を計算
            const emotionSums = {};
            const emotionLyrics = {}; // 各感情の歌詞を集約
            let totalLyricCount = 0;

            cellPoints.forEach((point) => {
              if (point.pie && Array.isArray(point.pie)) {
                point.pie.forEach((emotion) => {
                  if (!emotionSums[emotion.label]) {
                    emotionSums[emotion.label] = { v: 0, c: emotion.c };
                    emotionLyrics[emotion.label] = []; // 歌詞リストを初期化
                  }
                  emotionSums[emotion.label].v += emotion.v;
                  // 歌詞を集約（lyricsが存在する場合）
                  if (emotion.lyrics && Array.isArray(emotion.lyrics)) {
                    emotionLyrics[emotion.label].push(...emotion.lyrics);
                  }
                });
              }
              totalLyricCount += point.lyricCount || 0;
            });

            // 平均化（lyricsも含める）
            const avgPie = Object.keys(emotionSums).map((label) => ({
              label,
              v: emotionSums[label].v / cellPoints.length,
              c: emotionSums[label].c,
              lyrics: emotionLyrics[label] || [], // 集約した歌詞を追加
            }));

            // クラスタの半径（セル内の点の数に基づく）
            const clusterRadius = Math.max(
              8,
              Math.min(30, 8 + Math.sqrt(cellPoints.length) * 2)
            );

            clusters.push({
              x: centerX,
              y: centerY,
              r: clusterRadius,
              pie: avgPie,
              lyricCount: totalLyricCount,
              pointCount: cellPoints.length,
              progressionType: progressionType,
              progression: cellPoints[0].progression || "N/A",
              points: cellPoints, // 元のポイントを保持（詳細表示用）
            });
          });
        });

        return clusters;
      }

      /* ====== "曲数の合計" で半径を決める ======
         1点の pie の各セグメント label ごとに
         EMOTION_SONGS[label].length を取り、v(%) で重み付けして合計。
         → それを sqrt スケールで半径にする
      */
      function radiusFromLyricCount(count, minC, maxC) {
        const minR = 4;
        const maxR = 36;

        // 0〜1 に正規化
        const t = (count - minC) / (maxC - minC || 1);
        const clamped = Math.max(0, Math.min(1, t));

        // 小さい値を抑えるイージング
        const eased = Math.pow(clamped, 1.4);

        return minR + eased * (maxR - minR);
      }

      /* ========= セグメント判定（角度→どの感情か） ========= */
      function getSegmentEmotion(rawPoint, px, py, minRadius) {
        if (!rawPoint || !rawPoint.pie || !rawPoint.pie.length) return null;

        const dx = px - rawPoint._px;
        const dy = py - rawPoint._py;

        const baseR = rawPoint.r ?? 6;
        const r = Math.max(minRadius, baseR);

        if (Math.hypot(dx, dy) > r) return null;

        // 感情の順序に基づいてソート
        const sortedPie = sortPieByEmotionOrder(rawPoint.pie);

        // start = -PI/2 を基準に 0..2PI
        let ang = Math.atan2(dy, dx) - -Math.PI / 2;
        while (ang < 0) ang += Math.PI * 2;
        while (ang >= Math.PI * 2) ang -= Math.PI * 2;

        const total = sortedPie.reduce((a, s) => a + s.v, 0) || 1;
        let acc = 0;
        for (const s of sortedPie) {
          const span = (s.v / total) * Math.PI * 2;
          if (ang >= acc && ang < acc + span) return s.label;
          acc += span;
        }
        return sortedPie[sortedPie.length - 1]?.label ?? null;
      }

      // tooltip内のwheelイベントハンドラー
      function handleTooltipWheel(ev) {
        // tooltip内のスクロール可能な要素を探す
        const scrollableElement = ev.target.closest(".songs ul");

        if (
          scrollableElement &&
          scrollableElement.scrollHeight > scrollableElement.clientHeight
        ) {
          // スクロール可能な要素内でwheelイベントが発生した場合
          // イベントの伝播を確実に停止してChart.jsのズームを防ぐ
          ev.stopPropagation();
          ev.stopImmediatePropagation();

          // スクロールの上限・下限をチェック
          const isAtTop = scrollableElement.scrollTop === 0;
          const isAtBottom =
            scrollableElement.scrollTop + scrollableElement.clientHeight >=
            scrollableElement.scrollHeight - 1;

          // 上方向にスクロールしようとしているが、すでに最上部にいる場合
          if (ev.deltaY < 0 && isAtTop) {
            ev.preventDefault();
            return false;
          }

          // 下方向にスクロールしようとしているが、すでに最下部にいる場合
          if (ev.deltaY > 0 && isAtBottom) {
            ev.preventDefault();
            return false;
          }

          // スクロール可能な範囲内の場合、手動でスクロールを処理
          const scrollAmount = ev.deltaY;
          scrollableElement.scrollTop += scrollAmount;
          ev.preventDefault();
        } else {
          // tooltip内だがスクロール可能な要素外の場合、イベントの伝播を停止
          ev.stopPropagation();
          ev.stopImmediatePropagation();
        }
      }

      function escapeHtml(s) {
        return String(s)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      /* ========= release_date関連の関数 ========= */
      function extractYear(releaseDate) {
        if (!releaseDate) return null;
        // "1973" または "1973-04-10" 形式から年を抽出
        const match = String(releaseDate).match(/^(\d{4})/);
        return match ? parseInt(match[1], 10) : null;
      }

      /* ========= URLクエリパラメータ管理 ========= */
      function getQueryParams() {
        const params = new URLSearchParams(window.location.search);
        const result = {
          dataset: params.get("dataset"),
          artists: params.getAll("artist"),
          composers: params.getAll("composer"),
          lyricists: params.getAll("lyricist"),
          releaseDateMin: params.get("releaseDateMin"),
          releaseDateMax: params.get("releaseDateMax"),
          popularityMin: params.get("popularityMin"),
          popularityMax: params.get("popularityMax"),
        };
        console.log("getQueryParams result:", result);
        return result;
      }

      function updateURL(filters) {
        const params = new URLSearchParams();

        // データセット
        if (filters.dataset) {
          params.set("dataset", filters.dataset);
        }

        // アーティスト
        if (filters.artists && filters.artists.length > 0) {
          filters.artists.forEach((artist) => {
            if (artist && artist !== "") {
              params.append("artist", artist);
            }
          });
        }

        // 作曲家
        if (filters.composers && filters.composers.length > 0) {
          filters.composers.forEach((composer) => {
            if (composer && composer !== "") {
              params.append("composer", composer);
            }
          });
        }

        // 作詞家
        if (filters.lyricists && filters.lyricists.length > 0) {
          filters.lyricists.forEach((lyricist) => {
            if (lyricist && lyricist !== "") {
              params.append("lyricist", lyricist);
            }
          });
        }

        // リリース日
        if (filters.releaseDateMin) {
          params.set("releaseDateMin", filters.releaseDateMin);
        }
        if (filters.releaseDateMax) {
          params.set("releaseDateMax", filters.releaseDateMax);
        }

        // 人気度
        if (filters.popularityMin) {
          params.set("popularityMin", filters.popularityMin);
        }
        if (filters.popularityMax) {
          params.set("popularityMax", filters.popularityMax);
        }

        // URLを更新（履歴に追加）
        const newURL = params.toString()
          ? `${window.location.pathname}?${params.toString()}`
          : window.location.pathname;

        // 現在のURLと異なる場合のみ更新（無限ループを防ぐ）
        if (window.location.href !== window.location.origin + newURL) {
          window.history.pushState({}, "", newURL);
        }
      }

        } else if (popularityMaxInput && !queryParams.popularityMax) {
          popularityMaxInput.value = "";
        }

        // リリース日フィルタがクリアされた場合
        if (releaseDateMinInput && !queryParams.releaseDateMin) {
          releaseDateMinInput.value = "";
        }
        if (releaseDateMaxInput && !queryParams.releaseDateMax) {
          releaseDateMaxInput.value = "";
        }

        // 人気度フィルタがクリアされた場合
        if (popularityMinInput && !queryParams.popularityMin) {
          popularityMinInput.value = "";
        }

        // チャートが存在する場合は再描画
        if (shouldUpdateChart && chart && allPoints.length > 0) {
          console.log("Updating chart from applyFiltersFromURL");
          updateChart();
        } else {
          console.log("Chart update skipped:", {
            shouldUpdateChart,
            hasChart: !!chart,
            pointsCount: allPoints.length,
          });
        }
      }

      /* ========= フィルタリング機能 ========= */
      function extractFilterOptions(points) {
        const artists = new Map(); // Map<name, phraseCount>
        const composers = new Map(); // Map<name, phraseCount>
        const lyricists = new Map(); // Map<name, phraseCount>
        const releaseDates = [];
        const popularities = [];
        const uniqueSongs = new Set(); // 楽曲の重複を避けるためのSet（spotify_idまたはtitle+artist）

        // 各ポイントからアーティスト、作曲家、作詞家、リリース日、人気度を抽出
        for (const point of points) {
          if (!point.pie) continue;
          for (const pieItem of point.pie) {
            if (!pieItem.lyrics) continue;
            for (const lyric of pieItem.lyrics) {
              if (lyric.song) {
                // 楽曲のユニークIDを生成（spotify_idがあればそれを使用、なければtitle+artist）
                const songId =
                  lyric.song.spotify_id ||
                  (lyric.song.title && lyric.song.artist
                    ? `${lyric.song.title}|${lyric.song.artist}`
                    : null);
                if (songId) uniqueSongs.add(songId);

                // フレーズ数をカウント
                if (lyric.song.artist) {
                  const count = artists.get(lyric.song.artist) || 0;
                  artists.set(lyric.song.artist, count + 1);
                }
                if (lyric.song.composer) {
                  const count = composers.get(lyric.song.composer) || 0;
                  composers.set(lyric.song.composer, count + 1);
                }
                if (lyric.song.lyricist) {
                  const count = lyricists.get(lyric.song.lyricist) || 0;
                  lyricists.set(lyric.song.lyricist, count + 1);
                }
                if (lyric.song.release_date) {
                  // release_dateから年を抽出（"1973" または "1973-04-10" 形式）
                  const year = extractYear(lyric.song.release_date);
                  if (year) releaseDates.push(year);
                }
                if (
                  lyric.song.spotify_popularity !== null &&
                  lyric.song.spotify_popularity !== undefined
                ) {
                  popularities.push(lyric.song.spotify_popularity);
                }
              }
            }
          }
        }

        // release_dateの範囲を計算
        if (releaseDates.length > 0) {
          releaseDateRange.min = Math.min(...releaseDates);
          releaseDateRange.max = Math.max(...releaseDates);
          // 入力フィールドを初期化
          initializeReleaseDateInputs();
        }

        // spotify_popularityの範囲を計算
        if (popularities.length > 0) {
          popularityRange.min = Math.min(...popularities);
          popularityRange.max = Math.max(...popularities);
          // 入力フィールドを初期化
          initializePopularityInputs();
          console.log("Popularity range:", popularityRange);
        } else {
          console.log("No popularities found in data");
        }

        // release_dateの範囲をログ出力
        console.log("Release date range:", releaseDateRange);
        console.log("Number of release dates found:", releaseDates.length);
        console.log("Number of popularities found:", popularities.length);

        // 総フレーズ数を計算
        // 注意: これは可視化データに含まれるフレーズ数のみです
        // 実際の分析済みデータ（data/analyzed）の全てが可視化データに含まれているわけではありません
        // 可視化データは、感情閾値（最大値 ≥ 0.4）などのフィルタリングを経た後に生成されています
        let totalPhrases = 0;
        for (const point of points) {
          if (point.lyricCount) {
            totalPhrases += point.lyricCount;
          } else if (point.pie) {
            for (const pieItem of point.pie) {
              if (pieItem.lyrics) {
                totalPhrases += pieItem.lyrics.length;
              }
            }
          }
        }

        // 各カテゴリの総フレーズ数を計算
        const totalArtistPhrases = Array.from(artists.values()).reduce(
          (sum, count) => sum + count,
          0
        );
        const totalComposerPhrases = Array.from(composers.values()).reduce(
          (sum, count) => sum + count,
          0
        );
        const totalLyricistPhrases = Array.from(lyricists.values()).reduce(
          (sum, count) => sum + count,
          0
        );

        // 統計情報を更新
        updateStatistics(uniqueSongs.size, totalPhrases);

        // セレクターにオプションを追加
        const artistSelect = document.getElementById("artistFilter");
        const composerSelect = document.getElementById("composerFilter");
        const lyricistSelect = document.getElementById("lyricistFilter");

        // 既存のオプションをクリア（"すべて"以外）
        artistSelect.innerHTML = `<option value="" selected>すべて (${totalArtistPhrases})</option>`;
        composerSelect.innerHTML = `<option value="" selected>すべて (${totalComposerPhrases})</option>`;
        lyricistSelect.innerHTML = `<option value="" selected>すべて (${totalLyricistPhrases})</option>`;

        // ソートして追加（フレーズ数の降順）
        Array.from(artists.entries())
          .sort((a, b) => {
            // まずフレーズ数で降順ソート
            if (b[1] !== a[1]) return b[1] - a[1];
            // 同じフレーズ数の場合は名前でソート
            return a[0].localeCompare(b[0], "ja");
          })
          .forEach(([artist, count]) => {
            const option = document.createElement("option");
            option.value = artist;
            option.textContent = `${artist} (${count})`;
            artistSelect.appendChild(option);
          });

        Array.from(composers.entries())
          .sort((a, b) => {
            if (b[1] !== a[1]) return b[1] - a[1];
            return a[0].localeCompare(b[0], "ja");
          })
          .forEach(([composer, count]) => {
            const option = document.createElement("option");
            option.value = composer;
            option.textContent = `${composer} (${count})`;
            composerSelect.appendChild(option);
          });

        Array.from(lyricists.entries())
          .sort((a, b) => {
            if (b[1] !== a[1]) return b[1] - a[1];
            return a[0].localeCompare(b[0], "ja");
          })
          .forEach(([lyricist, count]) => {
            const option = document.createElement("option");
            option.value = lyricist;
            option.textContent = `${lyricist} (${count})`;
            lyricistSelect.appendChild(option);
          });
      }

      /* ========= 統計情報の更新 ========= */
      function updateStatistics(totalSongs, totalPhrases) {
        const statsEl = document.getElementById("statistics");
        if (statsEl) {
          statsEl.innerHTML = `
            <h2>分析対象データの統計（可視化データに含まれるデータ）</h2>
            <p><strong>可視化データに含まれる楽曲数：${totalSongs}曲</strong></p>
            <p><strong>可視化データに含まれる歌詞フレーズ数：${totalPhrases}フレーズ</strong></p>
            <p style="font-size: 0.9em; color: #666; margin-top: 10px;">
              ※ 注意: この統計は可視化用に生成されたデータに基づいています。<br>
              ※ 可視化データは、感情閾値（最大値 ≥ 0.4）などのフィルタリング条件を経た後に生成されています。<br>
              ※ 実際の分析済みデータ（data/analyzed）には約8,000曲以上が含まれていますが、感情が検出されたもののみが可視化データに含まれます。
            </p>
          `;
        }
      }

      function applyFilters(points) {
        const artistFilter = document.getElementById("artistFilter");
        const composerFilter = document.getElementById("composerFilter");
        const lyricistFilter = document.getElementById("lyricistFilter");
        const releaseDateMinInput = document.getElementById(
          "releaseDateMinInput"
        );
        const releaseDateMaxInput = document.getElementById(
          "releaseDateMaxInput"
        );
        const popularityMinInput =
          document.getElementById("popularityMinInput");
        const popularityMaxInput =
          document.getElementById("popularityMaxInput");

        // release_dateフィルタの値を取得
        const minReleaseYear =
          releaseDateMinInput && releaseDateMinInput.value
            ? parseInt(releaseDateMinInput.value, 10)
            : null;
        const maxReleaseYear =
          releaseDateMaxInput && releaseDateMaxInput.value
            ? parseInt(releaseDateMaxInput.value, 10)
            : null;
        const isReleaseDateFilterActive =
          minReleaseYear !== null || maxReleaseYear !== null;

        // spotify_popularityフィルタの値を取得
        const minPopularity =
          popularityMinInput && popularityMinInput.value
            ? parseInt(popularityMinInput.value, 10)
            : null;
        const maxPopularity =
          popularityMaxInput && popularityMaxInput.value
            ? parseInt(popularityMaxInput.value, 10)
            : null;
        const isPopularityFilterActive =
          minPopularity !== null || maxPopularity !== null;

        // デバッグ用
        if (isPopularityFilterActive) {
          console.log("Popularity filter active:", {
            min: minPopularity,
            max: maxPopularity,
          });
        }

        // デバッグ用（必要に応じてコメントアウト）
        if (isReleaseDateFilterActive) {
          console.log("Release date filter active:", {
            min: minReleaseYear,
            max: maxReleaseYear,
          });
        }

        // release_dateフィルタが有効な場合、artist/composer/lyricistフィルタを無効化
        if (isReleaseDateFilterActive) {
          artistFilter.disabled = true;
          composerFilter.disabled = true;
          lyricistFilter.disabled = true;
          // すべての選択を解除
          for (let i = 0; i < artistFilter.options.length; i++) {
            artistFilter.options[i].selected = false;
          }
          for (let i = 0; i < composerFilter.options.length; i++) {
            composerFilter.options[i].selected = false;
          }
          for (let i = 0; i < lyricistFilter.options.length; i++) {
            lyricistFilter.options[i].selected = false;
          }
          // "すべて"を選択
          if (artistFilter.options.length > 0)
            artistFilter.options[0].selected = true;
          if (composerFilter.options.length > 0)
            composerFilter.options[0].selected = true;
          if (lyricistFilter.options.length > 0)
            lyricistFilter.options[0].selected = true;
        } else {
          artistFilter.disabled = false;
          composerFilter.disabled = false;
          lyricistFilter.disabled = false;
        }

        // リリース年フィルタが有効な場合は、artist/composer/lyricistフィルタを無視
        const selectedArtists = isReleaseDateFilterActive
          ? []
          : Array.from(artistFilter.selectedOptions)
              .map((opt) => opt.value)
              .filter((v) => v !== "");
        const selectedComposers = isReleaseDateFilterActive
          ? []
          : Array.from(composerFilter.selectedOptions)
              .map((opt) => opt.value)
              .filter((v) => v !== "");
        const selectedLyricists = isReleaseDateFilterActive
          ? []
          : Array.from(lyricistFilter.selectedOptions)
              .map((opt) => opt.value)
              .filter((v) => v !== "");

        // フィルタリング条件がない場合は全ポイントを返す
        if (
          selectedArtists.length === 0 &&
          selectedComposers.length === 0 &&
          selectedLyricists.length === 0 &&
          !isReleaseDateFilterActive &&
          !isPopularityFilterActive
        ) {
          console.log(
            "No filters active, returning all points:",
            points.length
          );
          return points;
        }

        console.log("Filtering with conditions:", {
          releaseDateFilter: isReleaseDateFilterActive,
          popularityFilter: isPopularityFilterActive,
          selectedArtists: selectedArtists,
          selectedComposers: selectedComposers,
          selectedLyricists: selectedLyricists,
          totalPoints: points.length,
        });

        // フィルタリング
        return points
          .filter((point) => {
            if (!point.pie) return false;

            // release_dateフィルタが有効な場合
            if (isReleaseDateFilterActive) {
              // このポイントに関連するリリース年を収集
              const pointReleaseYears = [];

              for (const pieItem of point.pie) {
                if (!pieItem.lyrics) continue;
                for (const lyric of pieItem.lyrics) {
                  // デバッグ: 最初のポイントのlyric構造を確認
                  if (
                    point === points[0] &&
                    pieItem === point.pie[0] &&
                    lyric === pieItem.lyrics[0]
                  ) {
                    console.log("First lyric structure:", lyric);
                    console.log("lyric.song:", lyric.song);
                    console.log(
                      "lyric.song?.release_date:",
                      lyric.song?.release_date
                    );
                  }
                  if (lyric.song && lyric.song.release_date) {
                    const year = extractYear(lyric.song.release_date);
                    if (year) pointReleaseYears.push(year);
                  }
                }
              }

              // リリース年がない場合は除外
              if (pointReleaseYears.length === 0) {
                // デバッグ用
                if (point === points[0]) {
                  console.log("First point excluded: no release dates found");
                  console.log("Point pie structure:", point.pie);
                }
                return false;
              }

              // 少なくとも1つの歌詞が指定範囲内にあるかチェック
              const hasYearInRange = pointReleaseYears.some((year) => {
                if (minReleaseYear !== null && year < minReleaseYear)
                  return false;
                if (maxReleaseYear !== null && year > maxReleaseYear)
                  return false;
                return true;
              });

              // リリース年フィルタに一致しない場合は除外
              if (!hasYearInRange) {
                return false;
              }
            }

            // spotify_popularityフィルタが有効な場合
            if (isPopularityFilterActive) {
              // このポイントに関連する人気度を収集
              const pointPopularities = [];

              for (const pieItem of point.pie) {
                if (!pieItem.lyrics) continue;
                for (const lyric of pieItem.lyrics) {
                  if (
                    lyric.song &&
                    lyric.song.spotify_popularity !== null &&
                    lyric.song.spotify_popularity !== undefined
                  ) {
                    pointPopularities.push(lyric.song.spotify_popularity);
                  }
                }
              }

              // 人気度がない場合は除外
              if (pointPopularities.length === 0) {
                return false;
              }

              // 少なくとも1つの歌詞が指定範囲内にあるかチェック
              const hasPopularityInRange = pointPopularities.some(
                (popularity) => {
                  if (minPopularity !== null && popularity < minPopularity)
                    return false;
                  if (maxPopularity !== null && popularity > maxPopularity)
                    return false;
                  return true;
                }
              );

              // 人気度フィルタに一致しない場合は除外
              if (!hasPopularityInRange) {
                return false;
              }
            }

            // artist/composer/lyricistフィルタが有効な場合
            // このポイントに関連するアーティスト、作曲家、作詞家を収集
            const pointArtists = new Set();
            const pointComposers = new Set();
            const pointLyricists = new Set();

            for (const pieItem of point.pie) {
              if (!pieItem.lyrics) continue;
              for (const lyric of pieItem.lyrics) {
                if (lyric.song) {
                  if (lyric.song.artist) pointArtists.add(lyric.song.artist);
                  if (lyric.song.composer)
                    pointComposers.add(lyric.song.composer);
                  if (lyric.song.lyricist)
                    pointLyricists.add(lyric.song.lyricist);
                }
              }
            }

            // フィルタリング条件をチェック（AND検索：選択されたすべてに一致する必要がある）
            if (selectedArtists.length > 0) {
              // 選択されたすべてのアーティストがポイントに含まれているかチェック
              const hasAllSelectedArtists = selectedArtists.every((artist) =>
                pointArtists.has(artist)
              );
              if (!hasAllSelectedArtists) return false;
            }

            if (selectedComposers.length > 0) {
              // 選択されたすべての作曲家がポイントに含まれているかチェック
              const hasAllSelectedComposers = selectedComposers.every(
                (composer) => pointComposers.has(composer)
              );
              if (!hasAllSelectedComposers) return false;
            }

            if (selectedLyricists.length > 0) {
              // 選択されたすべての作詞家がポイントに含まれているかチェック
              const hasAllSelectedLyricists = selectedLyricists.every(
                (lyricist) => pointLyricists.has(lyricist)
              );
              if (!hasAllSelectedLyricists) return false;
            }

            return true;
          })
          .map((point) => {
            // フィルタリング条件に一致するポイントのpieデータをフィルタリング
            // 選択されたアーティスト/作曲家/作詞家に一致する歌詞のみを表示
            if (
              selectedArtists.length === 0 &&
              selectedComposers.length === 0 &&
              selectedLyricists.length === 0
            ) {
              return point; // フィルタがない場合はそのまま返す
            }

            // ポイントのコピーを作成
            const filteredPoint = { ...point };
            if (filteredPoint.pie) {
              filteredPoint.pie = filteredPoint.pie
                .map((pieItem) => {
                  if (!pieItem.lyrics) return pieItem;

                  // 歌詞をフィルタリング
                  const filteredLyrics = pieItem.lyrics.filter((lyric) => {
                    if (!lyric.song) return false;

                    // アーティストフィルタ
                    if (selectedArtists.length > 0) {
                      const matchesArtist = selectedArtists.some(
                        (artist) => lyric.song.artist === artist
                      );
                      if (!matchesArtist) return false;
                    }

                    // 作曲家フィルタ
                    if (selectedComposers.length > 0) {
                      const matchesComposer = selectedComposers.some(
                        (composer) => lyric.song.composer === composer
                      );
                      if (!matchesComposer) return false;
                    }

                    // 作詞家フィルタ
                    if (selectedLyricists.length > 0) {
                      const matchesLyricist = selectedLyricists.some(
                        (lyricist) => lyric.song.lyricist === lyricist
                      );
                      if (!matchesLyricist) return false;
                    }

                    return true;
                  });

                  // フィルタリング後の歌詞がない場合は、pieItemをnullにする（後で除外）
                  if (filteredLyrics.length === 0) {
                    return null;
                  }

                  // フィルタリング後の歌詞でpieItemを更新
                  return {
                    ...pieItem,
                    lyrics: filteredLyrics,
                    // 割合を再計算（フィルタリング後の歌詞数に基づく）
                    v:
                      (filteredLyrics.length / (pieItem.lyrics.length || 1)) *
                      (pieItem.v || 0),
                  };
                })
                .filter((pieItem) => pieItem !== null); // nullのpieItemを除外

              // フィルタリング後にpieが空になった場合は、ポイントを除外
              if (filteredPoint.pie.length === 0) {
                return null;
              }

              // pieの合計が100になるように正規化
              const totalV = filteredPoint.pie.reduce(
                (sum, p) => sum + (p.v || 0),
                0
              );
              if (totalV > 0) {
                filteredPoint.pie = filteredPoint.pie.map((p) => ({
                  ...p,
                  v: (p.v / totalV) * 100,
                }));
              }

              // lyricCountを再計算（フィルタリング後の歌詞数）
              let totalLyricCount = 0;
              filteredPoint.pie.forEach((pieItem) => {
                if (pieItem.lyrics && Array.isArray(pieItem.lyrics)) {
                  totalLyricCount += pieItem.lyrics.length;
                }
              });
              filteredPoint.lyricCount = totalLyricCount;
            } else {
              // pieがない場合でも、フィルタリング後の歌詞数を0に設定
              filteredPoint.lyricCount = 0;
            }

            return filteredPoint;
          })
          .filter((point) => point !== null); // nullのポイントを除外
      }

      function updateChart() {
        if (!chart || allPoints.length === 0) {
          console.log("updateChart: chart or allPoints is empty", {
            chart: !!chart,
            allPointsLength: allPoints.length,
          });
          return;
        }

        const filteredPoints = applyFilters(allPoints);
        console.log(
          "updateChart: Filtered points:",
          filteredPoints.length,
          "of",
          allPoints.length
        );

        // クラスタリングを再実行（統合データの場合）
        if (jsonFileName.includes("_all.json")) {
          clusteredPoints = clusterPointsByProgression(filteredPoints, 25);

          // lyricCountの最小値と最大値を再計算（クラスタ用）
          const lyricCounts = clusteredPoints
            .map((p) => p.lyricCount ?? 0)
            .filter((c) => c > 0);
          const minC = lyricCounts.length > 0 ? Math.min(...lyricCounts) : 0;
          const maxC = lyricCounts.length > 0 ? Math.max(...lyricCounts) : 1;

          // クラスタの半径を調整
          for (const cluster of clusteredPoints) {
            cluster.r = radiusFromLyricCount(cluster.lyricCount, minC, maxC);
            if (cluster.r <= 0) {
              cluster.r = 8;
            }
          }

          // 基準進行別にデータセットを分ける
          const datasets = {
            odo: [],
            komuro: [],
            marusa: [],
          };

          clusteredPoints.forEach((cluster) => {
            datasets[cluster.progressionType].push(cluster);
          });

          // チャートのデータを更新（配列をクリアしてから新しいデータを追加）
          chart.data.datasets[0].data.length = 0;
          chart.data.datasets[0].data.push(...datasets.odo);
          chart.data.datasets[1].data.length = 0;
          chart.data.datasets[1].data.push(...datasets.komuro);
          chart.data.datasets[2].data.length = 0;
          chart.data.datasets[2].data.push(...datasets.marusa);
          // チャートを強制的に再描画（アニメーションなし）
          console.log("updateChart: Updating clustered chart", {
            odo: datasets.odo.length,
            komuro: datasets.komuro.length,
            marusa: datasets.marusa.length,
          });
          chart.update("none");
          return;
        }

        // 通常モードの場合
        // lyricCountの最小値と最大値を再計算
        const lyricCounts = filteredPoints
          .map((p) => p.lyricCount ?? 0)
          .filter((c) => c > 0);
        const minC = lyricCounts.length > 0 ? Math.min(...lyricCounts) : 0;
        const maxC = lyricCounts.length > 0 ? Math.max(...lyricCounts) : 1;

        // 半径を再計算
        for (const p of filteredPoints) {
          // 元のrを保存（存在する場合）
          if (p.r !== undefined) {
            p.r_original = p.r;
          }

          // pieがないポイントでもrを設定する（デフォルト値）
          if (!p.pie?.length) {
            p.r = p.r ?? 6; // デフォルト半径
            continue;
          }

          const lyricCount = p.lyricCount ?? 0;
          p.r = radiusFromLyricCount(lyricCount, minC, maxC);
          if (p.r <= 0) {
            p.r = 4;
          }
        }

        // チャートのデータを更新（配列をクリアしてから新しいデータを追加）
        const dataset = chart.data.datasets[0];
        dataset.data.length = 0;
        dataset.data.push(...filteredPoints);
        // チャートを強制的に再描画（アニメーションなし）
        console.log(
          "updateChart: Updating chart with",
          filteredPoints.length,
          "points"
        );
        chart.update("none");
      }

      /* ========= データ読み込み → rを曲数合計で作り直す → 描画 ========= */
      async function loadAndRender(fileName) {
        // グローバル変数に保存（updateChart関数で使用するため）
        jsonFileName = fileName;
        const canvas = document.getElementById("myChart");

        // 現在のHTMLファイルの場所を基準にパスを構築
        const currentPath = window.location.pathname;
        const basePath = currentPath.substring(0, currentPath.lastIndexOf("/"));
        // キャッシュ対策: タイムスタンプを追加
        const jsonPath = basePath + "/data/" + fileName + "?t=" + Date.now();

        console.log("Current path:", currentPath);
        console.log("Base path:", basePath);
        console.log("Trying to load JSON from:", jsonPath);

        try {
          const res = await fetch(jsonPath);
          if (!res.ok) {
            throw new Error(
              `HTTP ${res.status}: ${res.statusText}\nTried path: ${jsonPath}\nCurrent location: ${window.location.href}`
            );
          }
          const data = await res.json();
          console.log("JSON loaded successfully from:", jsonPath);

          // デバッグ: 最初のポイントのsong構造を確認
          if (data.points?.[0]?.pie?.[0]?.lyrics?.[0]?.song) {
            console.log(
              "First song in JSON:",
              data.points[0].pie[0].lyrics[0].song
            );
            console.log(
              "Has release_date:",
              "release_date" in data.points[0].pie[0].lyrics[0].song
            );
            console.log(
              "Has spotify_popularity:",
              "spotify_popularity" in data.points[0].pie[0].lyrics[0].song
            );
          }

          let points = data.points ?? [];

          // 統合データファイル（umap_all.json, tsne_all.json）の場合は基準進行ラベルを付与
          if (jsonFileName.includes("_all.json")) {
            // 基準進行の定義
            const referenceProgressions = {
              odo: ["IV", "V", "iii", "vi"],
              komuro: ["vi", "IV", "V", "I"],
              marusa: ["IVM7", "III7", "vi7", "I7"],
            };

            // 各ポイントに最も近い基準進行を判定
            points = points.map((point) => {
              const romanProg = point.roman_progression || [];
              if (!romanProg.length) {
                return { ...point, progressionType: "odo" }; // デフォルト
              }

              // 各基準進行との一致度を計算
              let bestMatch = "odo";
              let bestScore = 0;

              Object.keys(referenceProgressions).forEach((type) => {
                const refProg = referenceProgressions[type];
                let matchCount = 0;
                // 循環的に比較
                for (let offset = 0; offset < romanProg.length; offset++) {
                  let matches = 0;
                  for (
                    let i = 0;
                    i < refProg.length && i + offset < romanProg.length;
                    i++
                  ) {
                    if (romanProg[i + offset] === refProg[i]) {
                      matches++;
                    }
                  }
                  matchCount = Math.max(matchCount, matches);
                }
                if (matchCount > bestScore) {
                  bestScore = matchCount;
                  bestMatch = type;
                }
              });

              return { ...point, progressionType: bestMatch };
            });
          }

          allPoints = points; // 全ポイントを保存
          EMOTION_SONGS = data.emotionSongs ?? {};

          // アーティスト、作曲家、作詞家のリストを抽出
          extractFilterOptions(points);

          // URLクエリパラメータからフィルタを適用（チャート作成前なので、shouldUpdateChart=false）
          // チャート作成後にupdateChart()を呼び出すため、ここではフィルタの選択のみ行う
          applyFiltersFromURL(false);

          // lyricCountの最小値と最大値を計算
          const lyricCounts = points
            .map((p) => p.lyricCount ?? 0)
            .filter((c) => c > 0);
          const minC = lyricCounts.length > 0 ? Math.min(...lyricCounts) : 0;
          const maxC = lyricCounts.length > 0 ? Math.max(...lyricCounts) : 1;

          console.log("Lyric count range:", { min: minC, max: maxC });

          // フィルタリングを適用
          const filteredPoints = applyFilters(points);

          // ★ここで「曲数合計」に基づいて各点のrを再計算する
          for (const p of filteredPoints) {
            // 元のrを保存（存在する場合）
            if (p.r !== undefined) {
              p.r_original = p.r;
            }

            // pieがないポイントでもrを設定する（デフォルト値）
            if (!p.pie?.length) {
              p.r = p.r ?? 6; // デフォルト半径
              continue;
            }

            const lyricCount = p.lyricCount ?? 0;
            p.r = radiusFromLyricCount(lyricCount, minC, maxC);
            // 半径が0以下の場合は最小値を設定
            if (p.r <= 0) {
              p.r = 4; // 最小半径
            }
          }

          // 既存のチャートがあれば破棄
          if (chart) {
            chart.destroy();
            chart = null;
            selected = null;
          }

          // Chart.jsが管理している既存のチャートも破棄
          const existingChart = Chart.getChart(canvas);
          if (existingChart) {
            existingChart.destroy();
          }

          // 統合データファイルの場合は色分け表示
          const isUnifiedData = jsonFileName.includes("_all.json");
          let datasets = [];

          if (isUnifiedData) {
            // 基準進行別にデータセットを分ける
            const groupedData = {
              odo: [],
              komuro: [],
              marusa: [],
            };

            filteredPoints.forEach((point) => {
              const type = point.progressionType || "odo";
              if (groupedData[type]) {
                groupedData[type].push(point);
              }
            });

            datasets = [
              {
                label: "王道進行",
                data: groupedData.odo,
                pointBackgroundColor: PROGRESSION_COLORS.odo,
                pointBorderColor: PROGRESSION_BORDER_COLORS.odo,
                pointBorderWidth: 0,
                pointRadius: (c) =>
                  c.raw?.isReferenceProgression ? 0 : c.raw?.r ?? 8,
                pointHitRadius: (c) => (c.raw?.r ?? 8) + 6,
                pointHoverRadius: 0,
              },
              {
                label: "小室進行",
                data: groupedData.komuro,
                pointBackgroundColor: PROGRESSION_COLORS.komuro,
                pointBorderColor: PROGRESSION_BORDER_COLORS.komuro,
                pointBorderWidth: 0,
                pointRadius: (c) =>
                  c.raw?.isReferenceProgression ? 0 : c.raw?.r ?? 8,
                pointHitRadius: (c) => (c.raw?.r ?? 8) + 6,
                pointHoverRadius: 0,
              },
              {
                label: "丸サ進行",
                data: groupedData.marusa,
                pointBackgroundColor: PROGRESSION_COLORS.marusa,
                pointBorderColor: PROGRESSION_BORDER_COLORS.marusa,
                pointBorderWidth: 0,
                pointRadius: (c) =>
                  c.raw?.isReferenceProgression ? 0 : c.raw?.r ?? 8,
                pointHitRadius: (c) => (c.raw?.r ?? 8) + 6,
                pointHoverRadius: 0,
              },
            ];
          } else {
            // 通常のデータファイル
            datasets = [
              {
                label: "Emotion points",
                data: filteredPoints,
                pointBackgroundColor: "rgba(0,0,0,0)",
                pointBorderColor: "rgba(0,0,0,0)",
                pointBorderWidth: 0,
                pointRadius: (c) =>
                  c.raw?.isReferenceProgression ? 0 : c.raw?.r ?? 6,
                pointHitRadius: (c) => (c.raw?.r ?? 6) + 6,
                pointHoverRadius: 0,
              },
            ];
          }

          chart = new Chart(canvas, {
            type: "bubble",
            data: {
              datasets: datasets,
            },
            options: {
              animation: false,
              normalized: true,
              plugins: {
                legend: { display: false }, // 凡例を非表示
                tooltip: { enabled: false, external: externalEmotionTooltip },
                piePointsCachedHover: {
                  strokeStyle: "#fff",
                  lineWidth: 0,
                  minRadius: 6,
                  hoverBoost: 3,
                },
                zoom: {
                  zoom: {
                    wheel: {
                      enabled: true,
                      speed: 0.1,
                      // tooltip内ではズームを無効化
                      filter: function (e) {
                        // tooltip要素内でwheelイベントが発生した場合は無視
                        const tooltip = document.querySelector(".pie-tooltip");
                        if (tooltip && tooltip.contains(e.target)) {
                          return false; // ズームを無効化
                        }
                        return true; // 通常通りズームを有効化
                      },
                    },
                    pinch: {
                      enabled: true,
                    },
                    mode: "xy",
                  },
                  pan: {
                    enabled: true,
                    mode: "xy",
                    modifierKey: null, // ドラッグでパン（修飾キー不要）
                  },
                  limits: {
                    x: { min: 0, max: 100 },
                    y: { min: 0, max: 100 },
                  },
                },
              },
              scales: {
                x: {
                  min: 0,
                  max: 100,
                  grid: { color: "rgba(0,0,0,.08)" },
                },
                y: {
                  min: 0,
                  max: 100,
                  grid: { color: "rgba(0,0,0,.08)" },
                },
              },
            },
          });

          // 古いクリックハンドラを削除
          if (clickHandler) {
            canvas.removeEventListener("click", clickHandler);
          }

          // クリック：点を選択して固定表示（スクロール可能にするため）
          clickHandler = (ev) => {
            const pos = Chart.helpers.getRelativePosition(ev, chart);
            const px = pos.x;
            const py = pos.y;

            const hits = chart.getElementsAtEventForMode(
              ev,
              "nearest",
              { intersect: true },
              true
            );
            if (!hits.length) {
              // クリックした場所に点がない場合は選択解除
              selected = null;
              chart.update();
              return;
            }

            const { datasetIndex, index } = hits[0];
            const raw = chart.data.datasets[datasetIndex].data[index];

            // 中心座標更新
            const meta = chart.getDatasetMeta(datasetIndex);
            const elem = meta.data[index];
            const { x, y } = elem.getProps(["x", "y"], true);
            raw._px = x;
            raw._py = y;

            const minRadius =
              chart.options.plugins.piePointsCachedHover.minRadius ?? 6;
            const emotion = getSegmentEmotion(raw, px, py, minRadius);

            // 同じ点をクリックした場合は選択解除、違う点または感情をクリックした場合は選択
            if (
              selected &&
              selected.datasetIndex === datasetIndex &&
              selected.index === index &&
              selected.emotion === emotion
            ) {
              // 同じ点・同じ感情をクリック → 選択解除
              selected = null;
            } else if (emotion) {
              // 感情セグメントをクリック → その感情を選択
              selected = { datasetIndex, index, emotion };
            } else {
              // 点の中心付近をクリック（感情セグメント外） → 点のみ選択（感情なし）
              selected = { datasetIndex, index, emotion: null };
            }
            chart.update();
          };
          canvas.addEventListener("click", clickHandler);

          // チャート作成後にフィルタを適用して再描画
          updateChart();
        } catch (e) {
          throw e;
        }
      }

      async function main() {
        const selector = document.getElementById("jsonSelector");

        // URLクエリパラメータからデータセットを読み込む
        const queryParams = getQueryParams();
        let defaultFile = selector.value;
        if (queryParams.dataset) {
          // URLパラメータで指定されたデータセットを選択
          selector.value = queryParams.dataset;
          defaultFile = queryParams.dataset;
        }

        // セレクターの変更イベント
        selector.addEventListener("change", async (e) => {
          const selectedFile = e.target.value;
          try {
            await loadAndRender(selectedFile);
            // URLを更新
            updateURLFromFilters();
          } catch (err) {
            console.error("Error loading data:", err);
            alert(`データの読み込みに失敗しました: ${err.message}`);
          }
        });

        // フィルタリングセレクターの変更イベント
        const artistFilter = document.getElementById("artistFilter");
        const composerFilter = document.getElementById("composerFilter");
        const lyricistFilter = document.getElementById("lyricistFilter");

        // セレクターをリセットする関数（マルチセレクター対応）
        function resetOtherFilters(currentFilter) {
          function resetSelect(select) {
            // すべての選択を解除
            for (let i = 0; i < select.options.length; i++) {
              select.options[i].selected = false;
            }
            // "すべて"オプションを選択
            if (select.options.length > 0) {
              select.options[0].selected = true;
            }
          }

          if (currentFilter === artistFilter) {
            // アーティストが変更されたら、作曲家と作詞家をリセット
            resetSelect(composerFilter);
            resetSelect(lyricistFilter);
          } else if (currentFilter === composerFilter) {
            // 作曲家が変更されたら、アーティストと作詞家をリセット
            resetSelect(artistFilter);
            resetSelect(lyricistFilter);
          } else if (currentFilter === lyricistFilter) {
            // 作詞家が変更されたら、アーティストと作曲家をリセット
            resetSelect(artistFilter);
            resetSelect(composerFilter);
          }
        }

        artistFilter.addEventListener("change", (e) => {
          // 「すべて」が選択されている場合は、他の選択を解除しない
          const selectedOptions = Array.from(artistFilter.selectedOptions);
          const hasAllSelected = selectedOptions.some(
            (opt) => opt.value === ""
          );
          if (hasAllSelected && selectedOptions.length > 1) {
            // 「すべて」と他のオプションが同時に選択されている場合は、「すべて」を解除
            artistFilter.options[0].selected = false;
          } else if (hasAllSelected) {
            // 「すべて」のみが選択されている場合は、他のフィルタはそのまま
          }
          updateURLFromFilters();
          updateChart();
        });
        composerFilter.addEventListener("change", (e) => {
          // 「すべて」が選択されている場合は、他の選択を解除しない
          const selectedOptions = Array.from(composerFilter.selectedOptions);
          const hasAllSelected = selectedOptions.some(
            (opt) => opt.value === ""
          );
          if (hasAllSelected && selectedOptions.length > 1) {
            // 「すべて」と他のオプションが同時に選択されている場合は、「すべて」を解除
            composerFilter.options[0].selected = false;
          } else if (hasAllSelected) {
            // 「すべて」のみが選択されている場合は、他のフィルタはそのまま
          }
          updateURLFromFilters();
          updateChart();
        });
        lyricistFilter.addEventListener("change", (e) => {
          // 「すべて」が選択されている場合は、他の選択を解除しない
          const selectedOptions = Array.from(lyricistFilter.selectedOptions);
          const hasAllSelected = selectedOptions.some(
            (opt) => opt.value === ""
          );
          if (hasAllSelected && selectedOptions.length > 1) {
            // 「すべて」と他のオプションが同時に選択されている場合は、「すべて」を解除
            lyricistFilter.options[0].selected = false;
          } else if (hasAllSelected) {
            // 「すべて」のみが選択されている場合は、他のフィルタはそのまま
          }
          updateURLFromFilters();
          updateChart();
        });

        // release_date入力フィールドのイベントリスナー
        const releaseDateMinInput = document.getElementById(
          "releaseDateMinInput"
        );
        const releaseDateMaxInput = document.getElementById(
          "releaseDateMaxInput"
        );

        if (releaseDateMinInput) {
          releaseDateMinInput.addEventListener("input", (e) => {
            updateURLFromFilters();
            updateChart();
          });
          releaseDateMinInput.addEventListener("change", (e) => {
            updateURLFromFilters();
            updateChart();
          });
        }

        if (releaseDateMaxInput) {
          releaseDateMaxInput.addEventListener("input", (e) => {
            updateURLFromFilters();
            updateChart();
          });
          releaseDateMaxInput.addEventListener("change", (e) => {
            updateURLFromFilters();
            updateChart();
          });
        }

        // spotify_popularity入力フィールドのイベントリスナー
        const popularityMinInput =
          document.getElementById("popularityMinInput");
        const popularityMaxInput =
          document.getElementById("popularityMaxInput");

        if (popularityMinInput) {
          popularityMinInput.addEventListener("input", (e) => {
            updateURLFromFilters();
            updateChart();
          });
          popularityMinInput.addEventListener("change", (e) => {
            updateURLFromFilters();
            updateChart();
          });
        }

        if (popularityMaxInput) {
          popularityMaxInput.addEventListener("input", (e) => {
            updateURLFromFilters();
            updateChart();
          });
          popularityMaxInput.addEventListener("change", (e) => {
            updateURLFromFilters();
            updateChart();
          });
        }

        // URL変更（ブラウザの戻る/進むボタン）をリッスン
        window.addEventListener("popstate", (e) => {
          console.log("URL changed, applying filters from URL");
          applyFiltersFromURL(true); // チャートを更新
        });

        // ズームコントロールのイベントリスナー
        const zoomInBtn = document.getElementById("zoomInBtn");
        const zoomOutBtn = document.getElementById("zoomOutBtn");
        const resetZoomBtn = document.getElementById("resetZoomBtn");

        function zoomChart(factor) {
          if (!chart) return;
          const xScale = chart.scales.x;
          const yScale = chart.scales.y;

          const centerX = (xScale.min + xScale.max) / 2;
          const centerY = (yScale.min + yScale.max) / 2;

          const rangeX = xScale.max - xScale.min;
          const rangeY = yScale.max - yScale.min;

          const newRangeX = rangeX / factor;
          const newRangeY = rangeY / factor;

          xScale.min = centerX - newRangeX / 2;
          xScale.max = centerX + newRangeX / 2;
          yScale.min = centerY - newRangeY / 2;
          yScale.max = centerY + newRangeY / 2;

          chart.update("none");
        }

        function resetZoomChart() {
          if (!chart) return;
          const xScale = chart.scales.x;
          const yScale = chart.scales.y;

          xScale.min = 0;
          xScale.max = 100;
          yScale.min = 0;
          yScale.max = 100;

          chart.update("none");
        }

        if (zoomInBtn) {
          zoomInBtn.addEventListener("click", () => {
            zoomChart(1.2);
          });
        }

        if (zoomOutBtn) {
          zoomOutBtn.addEventListener("click", () => {
            zoomChart(0.8);
          });
        }

        if (resetZoomBtn) {
          resetZoomBtn.addEventListener("click", () => {
            resetZoomChart();
          });
        }

        // 初期読み込み
        try {
          await loadAndRender(defaultFile);
        } catch (e) {
          console.error("Error loading data:", e);
          const errorMsg = `読み込みに失敗しました。\n\nエラー: ${e.message}\n\n確認事項:\n1. ローカルサーバーを起動しているか\n2. vis_system/scattergraph/ ディレクトリからサーバーを起動しているか\n   (例: cd vis_system/scattergraph && python3 -m http.server 8000)\n3. data/${defaultFile} が存在するか\n\nブラウザのコンソール（F12）で詳細を確認してください。`;
          alert(errorMsg);
        }
      }

      main();
    </script>

      style="
        margin-top: 40px;

        background-color: #f9f9f9;
      "
    >
      <h2>分析対象データの統計</h2>

    </div>
