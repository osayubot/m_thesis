<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>
      Emotion-based Chord Progression Scatter (typical_chord_distance)
    </title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, sans-serif;
        margin: 16px;
      }
      .json-selector select {
        height: 60px;
        font-size: 20px;
        margin: 4px 0;
      }
      .controls {
        margin-bottom: 16px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }
      .controls label {
        font-weight: 600;
        font-size: 14px;
      }
      .controls select {
        padding: 6px 12px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: white;
        cursor: pointer;
        min-width: 150px;
      }
      .controls select:hover {
        border-color: #999;
      }
      .filter-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .filter-group label {
        font-size: 12px;
        font-weight: 500;
      }
      .filter-group input[type="number"] {
        width: 80px;
        padding: 4px 8px;
        font-size: 14px;
        border: 1px solid #ccc;
        border-radius: 4px;
        margin: 0 4px;
      }
      .filter-group input[type="number"]:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .filter-group .date-range {
        display: flex;
        align-items: center;
        gap: 4px;
        margin-top: 4px;
      }
      .filter-group select:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      .explanation {
        background: #f5f5f5;
        border-left: 4px solid #4a90e2;
        padding: 12px 16px;
        margin: 16px 0;
        border-radius: 4px;
        font-size: 14px;
        line-height: 1.6;
      }
      .explanation h3 {
        margin: 0 0 8px 0;
        font-size: 16px;
        color: #333;
      }
      .explanation p {
        margin: 8px 0;
        color: #555;
      }
      .explanation ul {
        margin: 8px 0;
        padding-left: 24px;
        color: #555;
      }
      .explanation .color-legend {
        display: flex;
        gap: 16px;
        margin-top: 8px;
        flex-wrap: wrap;
      }
      .explanation .color-item {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .explanation .color-box {
        width: 20px;
        height: 20px;
        border-radius: 3px;
        border: 1px solid #ccc;
      }
      .color-stats {
        background: #f9f9f9;
        border: 1px solid #ddd;
        border-radius: 6px;
        padding: 12px 16px;
        margin: 16px 0;
        font-size: 14px;
      }
      .color-stats h4 {
        margin: 0 0 8px 0;
        font-size: 16px;
        color: #333;
      }
      .color-stats-items {
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
      }
      .color-stats-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .color-stats-box {
        width: 24px;
        height: 24px;
        border-radius: 4px;
        border: 1px solid #ccc;
      }
      .wrap {
        position: relative;
        width: min(2000px, 100%);
      }
      canvas {
        width: 100%;
        height: 1200px;
        background: #fff;
      }

      .pie-tooltip {
        position: absolute;
        pointer-events: none;
        z-index: 1000;
        background: rgba(0, 0, 0, 0.85);
        color: #fff;
        border-radius: 12px;
        padding: 10px 12px;
        font: 13px/1.35 system-ui, -apple-system, Segoe UI, sans-serif;
        min-width: 240px;
        max-width: 420px;
        max-height: 520px;
        overflow: auto;
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
        transform: translate(10px, 10px);
        opacity: 0;
        transition: opacity 0.06s linear;
      }
      .pie-tooltip .title {
        font-size: 14px;
        font-weight: 800;
        margin-bottom: 8px;
        opacity: 0.95;
        white-space: nowrap;
      }
      .pie-tooltip .rows {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .pie-tooltip .row {
        display: grid;
        grid-template-columns: 16px 1fr auto;
        align-items: center;
        column-gap: 8px;
      }
      .pie-tooltip .swatch {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        border: 2px solid rgba(255, 255, 255, 0.95);
        display: inline-block;
      }
      .pie-tooltip .name {
        font-weight: 650;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pie-tooltip .val {
        font-variant-numeric: tabular-nums;
        font-weight: 800;
        opacity: 0.95;
        white-space: nowrap;
      }

      .pie-tooltip .hint {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.16);
        font-size: 12px;
        opacity: 0.85;
      }
      .pie-tooltip .songs {
        margin-top: 8px;
        padding-top: 8px;
        border-top: 1px solid rgba(255, 255, 255, 0.16);
        font-size: 12px;
        opacity: 0.95;
      }
      .pie-tooltip .songs .head {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 900;
        margin-bottom: 6px;
        font-size: 12px;
        opacity: 0.95;
      }
      .pie-tooltip .songs ul {
        margin: 0;
        padding-left: 18px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .activeRow {
        outline: 1px solid rgba(255, 255, 255, 0.25);
        border-radius: 8px;
        padding: 4px 6px;
        margin-left: -6px;
        margin-right: -6px;
        background: rgba(255, 255, 255, 0.06);
      }
    </style>
  </head>

  <body>
    <div class="controls">
      <div class="json-selector">
        <label for="jsonSelector">データセット（感情 × 手法）</label>
        <br />
        <select id="jsonSelector">
          <optgroup label="JOY">
            <option value="JOY_umap.json">JOY - UMAP</option>
            <option value="JOY_tsne.json">JOY - t-SNE</option>
          </optgroup>
          <optgroup label="TRUST">
            <option value="TRUST_umap.json">TRUST - UMAP</option>
            <option value="TRUST_tsne.json">TRUST - t-SNE</option>
          </optgroup>
          <optgroup label="SADNESS">
            <option value="SADNESS_umap.json">SADNESS - UMAP</option>
            <option value="SADNESS_tsne.json">SADNESS - t-SNE</option>
          </optgroup>
          <optgroup label="ANGER">
            <option value="ANGER_umap.json">ANGER - UMAP</option>
            <option value="ANGER_tsne.json">ANGER - t-SNE</option>
          </optgroup>
          <optgroup label="FEAR">
            <option value="FEAR_umap.json">FEAR - UMAP</option>
            <option value="FEAR_tsne.json">FEAR - t-SNE</option>
          </optgroup>
          <optgroup label="DISGUST">
            <option value="DISGUST_umap.json">DISGUST - UMAP</option>
            <option value="DISGUST_tsne.json">DISGUST - t-SNE</option>
          </optgroup>
          <optgroup label="ANTICIPATION">
            <option value="ANTICIPATION_umap.json">ANTICIPATION - UMAP</option>
            <option value="ANTICIPATION_tsne.json">ANTICIPATION - t-SNE</option>
          </optgroup>
          <optgroup label="SURPRISE">
            <option value="SURPRISE_umap.json">SURPRISE - UMAP</option>
            <option value="SURPRISE_tsne.json">SURPRISE - t-SNE</option>
          </optgroup>
        </select>
      </div>
    </div>
    <div class="controls">
      <div class="filter-group">
        <label for="artistFilter"><strong>アーティスト</strong></label>
        <select id="artistFilter" multiple size="3">
          <option value="" selected>すべて</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="composerFilter"><strong>作曲家</strong></label>
        <select id="composerFilter" multiple size="3">
          <option value="" selected>すべて</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="lyricistFilter"><strong>作詞家</strong></label>
        <select id="lyricistFilter" multiple size="3">
          <option value="" selected>すべて</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="releaseDateMinInput"><strong>リリース年</strong></label>
        <div class="date-range">
          <input
            type="number"
            id="releaseDateMinInput"
            min="1900"
            max="2100"
            placeholder="開始年"
          />
          <span>~</span>
          <input
            type="number"
            id="releaseDateMaxInput"
            min="1900"
            max="2100"
            placeholder="終了年"
          />
        </div>
      </div>

      <div class="filter-group">
        <label for="popularityMinInput"><strong>Spotify人気度</strong></label>
        <div class="date-range">
          <input
            type="number"
            id="popularityMinInput"
            min="0"
            max="100"
            placeholder="最小値"
          />
          <span>~</span>
          <input
            type="number"
            id="popularityMaxInput"
            min="0"
            max="100"
            placeholder="最大値"
          />
        </div>
      </div>
    </div>
    <div class="color-stats" id="colorStats" style="display: none">
      <h4>典型コード進行パターンの分布</h4>
      <div class="color-stats-items">
        <div class="color-stats-item">
          <div class="color-stats-box" style="background-color: #0000ff"></div>
          <span
            >王道進行（odo）: <strong id="odoCount">0</strong> (<span
              id="odoPercent"
              >0.0</span
            >%)</span
          >
        </div>
        <div class="color-stats-item">
          <div class="color-stats-box" style="background-color: #ff0000"></div>
          <span
            >小室進行（komuro）: <strong id="komuroCount">0</strong> (<span
              id="komuroPercent"
              >0.0</span
            >%)</span
          >
        </div>
        <div class="color-stats-item">
          <div class="color-stats-box" style="background-color: #00ff00"></div>
          <span
            >丸サ進行（marusa）: <strong id="marusaCount">0</strong> (<span
              id="marusaPercent"
              >0.0</span
            >%)</span
          >
        </div>
        <div class="color-stats-item">
          <span>合計: <strong id="totalCount">0</strong></span>
        </div>
      </div>
    </div>
    <div class="wrap" id="wrap">
      <canvas id="myChart"></canvas>
    </div>

    <script>
      /* ====== 色定義 ====== */
      const EMOTION_COLORS = {
        JOY: "#FFFF73",
        SADNESS: "#5150F8",
        ANTICIPATION: "#F3AB63",
        SURPRISE: "#74BBF9",
        ANGER: "#E93323",
        FEAR: "#429429",
        DISGUST: "#EB60F8",
        TRUST: "#88FC6E",
      };

      /* ====== 感情の順序定義 ====== */
      const EMOTION_ORDER = [
        "JOY",
        "TRUST",
        "SADNESS",
        "ANGER",
        "FEAR",
        "DISGUST",
        "ANTICIPATION",
        "SURPRISE",
      ];

      /* ====== 状態 ====== */
      let chart = null;
      let selected = null;
      let allPoints = [];
      let releaseDateRange = { min: 1900, max: 2025 };
      let popularityRange = { min: 0, max: 100 };
      let clickHandler = null;

      /* ====== tooltip要素 ====== */
      function ensureTooltipEl() {
        const wrap = document.getElementById("wrap");
        let el = wrap.querySelector(".pie-tooltip");
        if (!el) {
          el = document.createElement("div");
          el.className = "pie-tooltip";
          wrap.appendChild(el);
        }
        return el;
      }

      /* ====== 半径を決める ====== */
      function radiusFromLyricCount(count, minC, maxC) {
        const minR = 3;
        const maxR = 20;

        const t = (count - minC) / (maxC - minC || 1);
        const clamped = Math.max(0, Math.min(1, t));

        const eased = Math.pow(clamped, 1.4);

        return minR + eased * (maxR - minR);
      }

      /* ========= external tooltip ========= */
      function externalEmotionTooltip(context) {
        const { chart, tooltip } = context;
        const el = ensureTooltipEl();
        const wrap = chart.canvas.parentNode;

        const active = chart.getActiveElements?.() ?? [];

        // ホバー時または選択時に表示
        if (tooltip.opacity === 0 && !selected) {
          el.style.opacity = 0;
          return;
        }

        let datasetIndex, index, raw, caretX, caretY;

        // ホバー時を優先、なければ選択時
        if (active.length) {
          datasetIndex = active[0].datasetIndex;
          index = active[0].index;
          raw = chart.data.datasets[datasetIndex].data[index];
          caretX = tooltip.caretX;
          caretY = tooltip.caretY;
        } else if (selected) {
          datasetIndex = selected.datasetIndex;
          index = selected.index;
          raw = chart.data.datasets[datasetIndex].data[index];

          const meta = chart.getDatasetMeta(datasetIndex);
          const elem = meta.data[index];
          const { x, y } = elem.getProps(["x", "y"], true);
          caretX = x;
          caretY = y;
        } else {
          el.style.opacity = 0;
          return;
        }

        // 感情分布を表示
        const sortedPie = raw.pie || [];
        const rows = sortedPie
          .map((s) => {
            return `
      <div class="row">
        <span class="swatch" style="background:${s.c}"></span>
        <span class="name">${escapeHtml(s.label)}</span>
        <span class="val">${Number(s.v).toFixed(2)}%</span>
      </div>
    `;
          })
          .join("");

        // 歌詞とアーティスト情報を表示（デフォルト表示）
        let songInfoHtml = "";
        const songInfo = raw.song_info;
        const lyricText = raw.lyric || "";

        if (songInfo || lyricText) {
          const parts = [];
          if (songInfo) {
            if (songInfo.title) parts.push(`歌名: ${songInfo.title}`);
            if (songInfo.artist) parts.push(`アーティスト: ${songInfo.artist}`);
            if (songInfo.lyricist) parts.push(`作詞: ${songInfo.lyricist}`);
            if (songInfo.composer) parts.push(`作曲: ${songInfo.composer}`);

            const additionalInfo = [];
            if (songInfo.release_date) {
              const year = extractYear(songInfo.release_date);
              if (year) {
                additionalInfo.push(`(${year})`);
              }
            }
            if (
              songInfo.spotify_popularity !== null &&
              songInfo.spotify_popularity !== undefined
            ) {
              additionalInfo.push(`人気度: ${songInfo.spotify_popularity}`);
            }

            if (additionalInfo.length > 0) {
              parts.push(additionalInfo.join(" "));
            }
          }

          const songInfoStr = parts.length > 0 ? parts.join(", ") : "";

          songInfoHtml = `
        <div class="songs">
          ${
            lyricText
              ? `<div style="margin-bottom: 8px;"><strong>「${escapeHtml(
                  lyricText
                )}」</strong></div>`
              : ""
          }
          ${songInfoStr ? `<div>${escapeHtml(songInfoStr)}</div>` : ""}
        </div>
      `;
        }

        const progression =
          raw.progression || raw.chord_progression?.join(" - ") || "N/A";

        el.innerHTML = `
    <div class="title">progression: ${escapeHtml(progression)}</div>
    <div class="rows">${rows}</div>
    ${songInfoHtml}
  `;

        const canvasRect = chart.canvas.getBoundingClientRect();
        const wrapRect = wrap.getBoundingClientRect();

        let left = canvasRect.left - wrapRect.left + caretX + 10;
        let top = canvasRect.top - wrapRect.top + caretY + 10;

        el.style.opacity = 1;
        const tr = el.getBoundingClientRect();

        if (left + tr.width > wrapRect.width)
          left = canvasRect.left - wrapRect.left + caretX - tr.width - 10;
        if (top + tr.height > wrapRect.height)
          top = canvasRect.top - wrapRect.top + caretY - tr.height - 10;

        el.style.left = left + "px";
        el.style.top = top + "px";
      }

      function escapeHtml(s) {
        return String(s)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      /* ========= release_date関連の関数 ========= */
      function extractYear(releaseDate) {
        if (!releaseDate) return null;
        const match = String(releaseDate).match(/^(\d{4})/);
        return match ? parseInt(match[1], 10) : null;
      }

      function initializeReleaseDateInputs() {
        const minInput = document.getElementById("releaseDateMinInput");
        const maxInput = document.getElementById("releaseDateMaxInput");

        if (!minInput || !maxInput) return;

        minInput.min = releaseDateRange.min;
        minInput.max = releaseDateRange.max;
        minInput.placeholder = releaseDateRange.min.toString();

        maxInput.min = releaseDateRange.min;
        maxInput.max = releaseDateRange.max;
        maxInput.placeholder = releaseDateRange.max.toString();
      }

      function initializePopularityInputs() {
        const minInput = document.getElementById("popularityMinInput");
        const maxInput = document.getElementById("popularityMaxInput");

        if (!minInput || !maxInput) return;

        minInput.min = popularityRange.min;
        minInput.max = popularityRange.max;
        minInput.placeholder = popularityRange.min.toString();

        maxInput.min = popularityRange.min;
        maxInput.max = popularityRange.max;
        maxInput.placeholder = popularityRange.max.toString();
      }

      /* ========= フィルタリング機能 ========= */
      function extractFilterOptions(points) {
        // カウント用のMapを使用（40以上のみ表示）
        // 各Mapは {phraseCount: number, songSet: Set} のオブジェクトを保持
        const artistData = new Map(); // artist -> {phraseCount, songSet}
        const composerData = new Map(); // composer -> {phraseCount, songSet}
        const lyricistData = new Map(); // lyricist -> {phraseCount, songSet}
        const releaseDates = [];
        const popularities = [];

        // 各ポイントをループしてカウント
        for (const point of points) {
          const songInfo = point.song_info;
          if (songInfo) {
            // 楽曲のユニークIDを作成（spotify_idがあればそれを使用、なければtitle+artist）
            const songId =
              songInfo.spotify_id ||
              `${songInfo.title || ""}_${songInfo.artist || ""}`;

            // アーティストのカウント
            if (songInfo.artist) {
              if (!artistData.has(songInfo.artist)) {
                artistData.set(songInfo.artist, {
                  phraseCount: 0,
                  songSet: new Set(),
                });
              }
              const data = artistData.get(songInfo.artist);
              data.phraseCount += 1;
              data.songSet.add(songId);
            }
            // 作曲家のカウント
            if (songInfo.composer) {
              if (!composerData.has(songInfo.composer)) {
                composerData.set(songInfo.composer, {
                  phraseCount: 0,
                  songSet: new Set(),
                });
              }
              const data = composerData.get(songInfo.composer);
              data.phraseCount += 1;
              data.songSet.add(songId);
            }
            // 作詞家のカウント
            if (songInfo.lyricist) {
              if (!lyricistData.has(songInfo.lyricist)) {
                lyricistData.set(songInfo.lyricist, {
                  phraseCount: 0,
                  songSet: new Set(),
                });
              }
              const data = lyricistData.get(songInfo.lyricist);
              data.phraseCount += 1;
              data.songSet.add(songId);
            }
            if (songInfo.release_date) {
              const year = extractYear(songInfo.release_date);
              if (year) releaseDates.push(year);
            }
            if (
              songInfo.spotify_popularity !== null &&
              songInfo.spotify_popularity !== undefined
            ) {
              popularities.push(songInfo.spotify_popularity);
            }
          }
        }

        if (releaseDates.length > 0) {
          releaseDateRange.min = Math.min(...releaseDates);
          releaseDateRange.max = Math.max(...releaseDates);
          initializeReleaseDateInputs();
        }

        if (popularities.length > 0) {
          popularityRange.min = Math.min(...popularities);
          popularityRange.max = Math.max(...popularities);
          initializePopularityInputs();
        }

        const artistSelect = document.getElementById("artistFilter");
        const composerSelect = document.getElementById("composerFilter");
        const lyricistSelect = document.getElementById("lyricistFilter");

        artistSelect.innerHTML = '<option value="" selected>すべて</option>';
        composerSelect.innerHTML = '<option value="" selected>すべて</option>';
        lyricistSelect.innerHTML = '<option value="" selected>すべて</option>';

        // 40以上のアーティストのみを表示
        Array.from(artistData.entries())
          .filter(([_, data]) => data.phraseCount >= 40)
          .sort(([a, _], [b, __]) => a.localeCompare(b))
          .forEach(([artist, data]) => {
            const option = document.createElement("option");
            option.value = artist;
            option.textContent = `${artist} (フレーズ: ${data.phraseCount}, 楽曲数: ${data.songSet.size})`;
            artistSelect.appendChild(option);
          });

        // 40以上の作曲家のみを表示
        Array.from(composerData.entries())
          .filter(([_, data]) => data.phraseCount >= 40)
          .sort(([a, _], [b, __]) => a.localeCompare(b))
          .forEach(([composer, data]) => {
            const option = document.createElement("option");
            option.value = composer;
            option.textContent = `${composer} (フレーズ: ${data.phraseCount}, 楽曲数: ${data.songSet.size})`;
            composerSelect.appendChild(option);
          });

        // 40以上の作詞家のみを表示
        Array.from(lyricistData.entries())
          .filter(([_, data]) => data.phraseCount >= 40)
          .sort(([a, _], [b, __]) => a.localeCompare(b))
          .forEach(([lyricist, data]) => {
            const option = document.createElement("option");
            option.value = lyricist;
            option.textContent = `${lyricist} (フレーズ: ${data.phraseCount}, 楽曲数: ${data.songSet.size})`;
            lyricistSelect.appendChild(option);
          });
      }

      function applyFilters(points) {
        const artistFilter = document.getElementById("artistFilter");
        const composerFilter = document.getElementById("composerFilter");
        const lyricistFilter = document.getElementById("lyricistFilter");
        const releaseDateMinInput = document.getElementById(
          "releaseDateMinInput"
        );
        const releaseDateMaxInput = document.getElementById(
          "releaseDateMaxInput"
        );
        const popularityMinInput =
          document.getElementById("popularityMinInput");
        const popularityMaxInput =
          document.getElementById("popularityMaxInput");

        const minReleaseYear =
          releaseDateMinInput && releaseDateMinInput.value
            ? parseInt(releaseDateMinInput.value, 10)
            : null;
        const maxReleaseYear =
          releaseDateMaxInput && releaseDateMaxInput.value
            ? parseInt(releaseDateMaxInput.value, 10)
            : null;
        const isReleaseDateFilterActive =
          minReleaseYear !== null || maxReleaseYear !== null;

        const minPopularity =
          popularityMinInput && popularityMinInput.value
            ? parseInt(popularityMinInput.value, 10)
            : null;
        const maxPopularity =
          popularityMaxInput && popularityMaxInput.value
            ? parseInt(popularityMaxInput.value, 10)
            : null;
        const isPopularityFilterActive =
          minPopularity !== null || maxPopularity !== null;

        if (isReleaseDateFilterActive) {
          artistFilter.disabled = true;
          composerFilter.disabled = true;
          lyricistFilter.disabled = true;
          for (let i = 0; i < artistFilter.options.length; i++) {
            artistFilter.options[i].selected = false;
          }
          for (let i = 0; i < composerFilter.options.length; i++) {
            composerFilter.options[i].selected = false;
          }
          for (let i = 0; i < lyricistFilter.options.length; i++) {
            lyricistFilter.options[i].selected = false;
          }
          if (artistFilter.options.length > 0)
            artistFilter.options[0].selected = true;
          if (composerFilter.options.length > 0)
            composerFilter.options[0].selected = true;
          if (lyricistFilter.options.length > 0)
            lyricistFilter.options[0].selected = true;
        } else {
          artistFilter.disabled = false;
          composerFilter.disabled = false;
          lyricistFilter.disabled = false;
        }

        const selectedArtists = isReleaseDateFilterActive
          ? []
          : Array.from(artistFilter.selectedOptions)
              .map((opt) => opt.value)
              .filter((v) => v !== "");
        const selectedComposers = isReleaseDateFilterActive
          ? []
          : Array.from(composerFilter.selectedOptions)
              .map((opt) => opt.value)
              .filter((v) => v !== "");
        const selectedLyricists = isReleaseDateFilterActive
          ? []
          : Array.from(lyricistFilter.selectedOptions)
              .map((opt) => opt.value)
              .filter((v) => v !== "");

        if (
          selectedArtists.length === 0 &&
          selectedComposers.length === 0 &&
          selectedLyricists.length === 0 &&
          !isReleaseDateFilterActive &&
          !isPopularityFilterActive
        ) {
          return points;
        }

        return points.filter((point) => {
          const songInfo = point.song_info;

          if (isReleaseDateFilterActive) {
            if (!songInfo || !songInfo.release_date) {
              return false;
            }
            const year = extractYear(songInfo.release_date);
            if (!year) {
              return false;
            }
            if (minReleaseYear !== null && year < minReleaseYear) {
              return false;
            }
            if (maxReleaseYear !== null && year > maxReleaseYear) {
              return false;
            }
          }

          if (isPopularityFilterActive) {
            if (
              !songInfo ||
              songInfo.spotify_popularity === null ||
              songInfo.spotify_popularity === undefined
            ) {
              return false;
            }
            const popularity = songInfo.spotify_popularity;
            if (minPopularity !== null && popularity < minPopularity) {
              return false;
            }
            if (maxPopularity !== null && popularity > maxPopularity) {
              return false;
            }
          }

          if (selectedArtists.length > 0) {
            if (!songInfo || !songInfo.artist) {
              return false;
            }
            const hasSelectedArtist = selectedArtists.includes(songInfo.artist);
            if (!hasSelectedArtist) return false;
          }

          if (selectedComposers.length > 0) {
            if (!songInfo || !songInfo.composer) {
              return false;
            }
            const hasSelectedComposer = selectedComposers.includes(
              songInfo.composer
            );
            if (!hasSelectedComposer) return false;
          }

          if (selectedLyricists.length > 0) {
            if (!songInfo || !songInfo.lyricist) {
              return false;
            }
            const hasSelectedLyricist = selectedLyricists.includes(
              songInfo.lyricist
            );
            if (!hasSelectedLyricist) return false;
          }

          return true;
        });
      }

      /* ========= 色の統計を更新 ========= */
      function updateColorStats(points) {
        const statsEl = document.getElementById("colorStats");
        const odoCountEl = document.getElementById("odoCount");
        const komuroCountEl = document.getElementById("komuroCount");
        const marusaCountEl = document.getElementById("marusaCount");
        const totalCountEl = document.getElementById("totalCount");
        const odoPercentEl = document.getElementById("odoPercent");
        const komuroPercentEl = document.getElementById("komuroPercent");
        const marusaPercentEl = document.getElementById("marusaPercent");

        if (
          !statsEl ||
          !odoCountEl ||
          !komuroCountEl ||
          !marusaCountEl ||
          !totalCountEl ||
          !odoPercentEl ||
          !komuroPercentEl ||
          !marusaPercentEl
        ) {
          return;
        }

        let odoCount = 0;
        let komuroCount = 0;
        let marusaCount = 0;

        for (const point of points) {
          const refColor = point.reference_color;
          const refName = point.reference_name;

          // reference_colorまたはreference_nameで判定
          if (refColor === "#0000FF" || refName === "odo") {
            odoCount++;
          } else if (refColor === "#FF0000" || refName === "komuro") {
            komuroCount++;
          } else if (refColor === "#00FF00" || refName === "marusa") {
            marusaCount++;
          }
        }

        const total = points.length;

        odoCountEl.textContent = odoCount;
        komuroCountEl.textContent = komuroCount;
        marusaCountEl.textContent = marusaCount;
        totalCountEl.textContent = total;

        // パーセンテージを計算して表示
        if (total > 0) {
          const odoPercent = ((odoCount / total) * 100).toFixed(1);
          const komuroPercent = ((komuroCount / total) * 100).toFixed(1);
          const marusaPercent = ((marusaCount / total) * 100).toFixed(1);

          odoPercentEl.textContent = odoPercent;
          komuroPercentEl.textContent = komuroPercent;
          marusaPercentEl.textContent = marusaPercent;
        } else {
          odoPercentEl.textContent = "0.0";
          komuroPercentEl.textContent = "0.0";
          marusaPercentEl.textContent = "0.0";
        }

        // 統計を表示
        if (total > 0) {
          statsEl.style.display = "block";
        } else {
          statsEl.style.display = "none";
        }
      }

      function updateChart() {
        if (!chart || allPoints.length === 0) return;

        const filteredPoints = applyFilters(allPoints);

        // 色の統計を更新
        updateColorStats(filteredPoints);

        const lyricCounts = filteredPoints
          .map((p) => p.lyricCount ?? 0)
          .filter((c) => c > 0);
        const minC = lyricCounts.length > 0 ? Math.min(...lyricCounts) : 0;
        const maxC = lyricCounts.length > 0 ? Math.max(...lyricCounts) : 1;

        const pointsWithColor = filteredPoints.map((p) => {
          const lyricCount = p.lyricCount ?? 0;
          const r = radiusFromLyricCount(lyricCount, minC, maxC);
          return {
            ...p,
            r: r > 0 ? r : 4,
            backgroundColor: p.reference_color || "#808080", // 基準進行に基づく色
          };
        });

        chart.data.datasets[0].data = pointsWithColor;
        // backgroundColorを配列として設定（各ポイントの色）
        chart.data.datasets[0].backgroundColor = pointsWithColor.map(
          (p) => p.backgroundColor || p.reference_color || "#808080"
        );
        chart.update();
      }

      /* ========= データ読み込み → 描画 ========= */
      async function loadAndRender(jsonFileName) {
        const canvas = document.getElementById("myChart");

        const currentPath = window.location.pathname;
        const basePath = currentPath.substring(0, currentPath.lastIndexOf("/"));
        const jsonPath =
          basePath + "/data/" + jsonFileName + "?t=" + Date.now();

        try {
          const res = await fetch(jsonPath);
          if (!res.ok) {
            throw new Error(
              `HTTP ${res.status}: ${res.statusText}\nTried path: ${jsonPath}`
            );
          }
          const data = await res.json();

          const points = data.points ?? [];
          allPoints = points;

          extractFilterOptions(points);

          const lyricCounts = points
            .map((p) => p.lyricCount ?? 0)
            .filter((c) => c > 0);
          const minC = lyricCounts.length > 0 ? Math.min(...lyricCounts) : 0;
          const maxC = lyricCounts.length > 0 ? Math.max(...lyricCounts) : 1;

          const filteredPoints = applyFilters(points);

          // 色の統計を更新
          updateColorStats(filteredPoints);

          // 点に色と半径を設定
          const pointsWithStyle = filteredPoints.map((p) => {
            const lyricCount = p.lyricCount ?? 0;
            const r = radiusFromLyricCount(lyricCount, minC, maxC);
            return {
              ...p,
              r: r > 0 ? r : 4,
              backgroundColor: p.reference_color || "#808080", // 基準進行に基づく色
            };
          });

          // backgroundColorを配列として作成（各ポイントの色）
          const backgroundColorArray = pointsWithStyle.map(
            (p) => p.backgroundColor || p.reference_color || "#808080"
          );

          if (chart) {
            chart.destroy();
            chart = null;
            selected = null;
          }

          const existingChart = Chart.getChart(canvas);
          if (existingChart) {
            existingChart.destroy();
          }

          chart = new Chart(canvas, {
            type: "bubble",
            data: {
              datasets: [
                {
                  label: "Emotion points",
                  data: pointsWithStyle,
                  backgroundColor: backgroundColorArray,
                  pointRadius: (c) => c.raw?.r ?? 6,
                  pointHitRadius: (c) => (c.raw?.r ?? 6) + 6,
                  pointHoverRadius: (c) => (c.raw?.r ?? 6) + 2,
                },
              ],
            },
            options: {
              animation: false,
              normalized: true,
              plugins: {
                legend: { display: false },
                tooltip: {
                  enabled: false,
                  external: externalEmotionTooltip,
                },
              },
              scales: {
                x: { min: 0, max: 100, grid: { color: "rgba(0,0,0,.08)" } },
                y: { min: 0, max: 100, grid: { color: "rgba(0,0,0,.08)" } },
              },
            },
          });

          if (clickHandler) {
            canvas.removeEventListener("click", clickHandler);
          }

          clickHandler = (ev) => {
            const hits = chart.getElementsAtEventForMode(
              ev,
              "nearest",
              { intersect: true },
              true
            );
            if (!hits.length) {
              selected = null;
              chart.update();
              return;
            }

            const { datasetIndex, index } = hits[0];

            // クリックされた点を選択/選択解除
            if (
              selected &&
              selected.datasetIndex === datasetIndex &&
              selected.index === index
            ) {
              selected = null;
            } else {
              selected = { datasetIndex, index };
            }
            chart.update();
          };
          canvas.addEventListener("click", clickHandler);
        } catch (e) {
          throw e;
        }
      }

      async function main() {
        const selector = document.getElementById("jsonSelector");
        const defaultFile = selector.value;

        selector.addEventListener("change", async (e) => {
          const selectedFile = e.target.value;
          try {
            await loadAndRender(selectedFile);
          } catch (err) {
            console.error("Error loading data:", err);
            alert(`データの読み込みに失敗しました: ${err.message}`);
          }
        });

        const artistFilter = document.getElementById("artistFilter");
        const composerFilter = document.getElementById("composerFilter");
        const lyricistFilter = document.getElementById("lyricistFilter");

        function resetOtherFilters(currentFilter) {
          function resetSelect(select) {
            for (let i = 0; i < select.options.length; i++) {
              select.options[i].selected = false;
            }
            if (select.options.length > 0) {
              select.options[0].selected = true;
            }
          }

          if (currentFilter === artistFilter) {
            resetSelect(composerFilter);
            resetSelect(lyricistFilter);
          } else if (currentFilter === composerFilter) {
            resetSelect(artistFilter);
            resetSelect(lyricistFilter);
          } else if (currentFilter === lyricistFilter) {
            resetSelect(artistFilter);
            resetSelect(composerFilter);
          }
        }

        artistFilter.addEventListener("change", (e) => {
          resetOtherFilters(artistFilter);
          updateChart();
        });
        composerFilter.addEventListener("change", (e) => {
          resetOtherFilters(composerFilter);
          updateChart();
        });
        lyricistFilter.addEventListener("change", (e) => {
          resetOtherFilters(lyricistFilter);
          updateChart();
        });

        const releaseDateMinInput = document.getElementById(
          "releaseDateMinInput"
        );
        const releaseDateMaxInput = document.getElementById(
          "releaseDateMaxInput"
        );

        if (releaseDateMinInput) {
          releaseDateMinInput.addEventListener("input", (e) => {
            updateChart();
          });
          releaseDateMinInput.addEventListener("change", (e) => {
            updateChart();
          });
        }

        if (releaseDateMaxInput) {
          releaseDateMaxInput.addEventListener("input", (e) => {
            updateChart();
          });
          releaseDateMaxInput.addEventListener("change", (e) => {
            updateChart();
          });
        }

        const popularityMinInput =
          document.getElementById("popularityMinInput");
        const popularityMaxInput =
          document.getElementById("popularityMaxInput");

        if (popularityMinInput) {
          popularityMinInput.addEventListener("input", (e) => {
            updateChart();
          });
          popularityMinInput.addEventListener("change", (e) => {
            updateChart();
          });
        }

        if (popularityMaxInput) {
          popularityMaxInput.addEventListener("input", (e) => {
            updateChart();
          });
          popularityMaxInput.addEventListener("change", (e) => {
            updateChart();
          });
        }

        try {
          await loadAndRender(defaultFile);
        } catch (e) {
          console.error("Error loading data:", e);
          const errorMsg = `読み込みに失敗しました。\n\nエラー: ${e.message}\n\n確認事項:\n1. ローカルサーバーを起動しているか\n2. vis_system/scattergraph2/ ディレクトリからサーバーを起動しているか\n   (例: cd vis_system/scattergraph2 && python3 -m http.server 8000)\n3. data/${defaultFile} が存在するか\n\nブラウザのコンソール（F12）で詳細を確認してください。`;
          alert(errorMsg);
        }
      }

      main();
    </script>
  </body>
</html>
